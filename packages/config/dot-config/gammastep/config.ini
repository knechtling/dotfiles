; Night light for dwl (wlr-gamma-control). Started from dwl-startup.sh.
; Rough location (centre of Germany) instead of a location service: good
; enough for sunrise/sunset, adapts over the year.
[general]
temp-day=6500
temp-night=4000
fade=1
adjustment-method=wayland
location-provider=manual

[manual]
lat=51.0
lon=10.0
