font_family Fira Code SemiBold
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
confirm_os_window_close 0

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 10000
scrollback_pager_history_size 20
scrollback_pager nvim -c "setlocal buftype=nofile bufhidden=wipe noswapfile" -c "nnoremap <silent> q :qa!<CR>" -c "call cursor(0, INPUT_LINE_NUMBER)" -
wheel_scroll_min_lines 1

# Browse/search scrollback in Neovim (kitty-scrollback.nvim)
action_alias kitty_scrollback_nvim kitten /home/anton/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
action_alias kitty_tmux kitten /home/anton/dotfiles-desktop/packages/config/dot-config/kitty/tmux.py
action_alias kitty_tmux_help launch --type=overlay sh -c "less /home/anton/.local/share/larbs/getkeys/kitty"
map ctrl+shift+s kitty_scrollback_nvim

# Shell integration and command-output navigation
shell_integration enabled
map ctrl+shift+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1
mouse_map right press ungrabbed mouse_select_command_output


# Open new shells in the current working directory
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t new_tab_with_cwd

# Hints: pick visible URLs, paths, lines, or words without using the mouse
map ctrl+shift+e open_url_with_hints
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>l kitten hints --type line --program -
map ctrl+shift+p>w kitten hints --type word --program -
map ctrl+shift+p>y kitten hints --type hyperlink
map ctrl+shift+u kitten unicode_input

# tmux-compatible window management. In Kitty terminology a tmux window is a
# tab, and a tmux pane is a window. Ctrl-b enters a one-command mode, matching
# tmux's prefix behavior; an unknown key cancels the prefix.
# The short-lived repeat mode reproduces tmux's -r bindings after the first
# resize/tab-move command. F24 is only a declaration hook for that mode.
map --new-mode tmux-repeat --timeout=0.5 --on-unknown=passthrough ctrl+shift+f24
map --mode tmux-repeat shift+h resize_window narrower 5
map --mode tmux-repeat shift+j resize_window shorter 5
map --mode tmux-repeat shift+k resize_window taller 5
map --mode tmux-repeat shift+l resize_window wider 5
map --mode tmux-repeat 0x3c move_tab_backward
map --mode tmux-repeat 0x3e move_tab_forward
map --mode tmux-repeat shift+0x3c move_tab_forward
map --mode tmux-repeat alt+left resize_window narrower 5
map --mode tmux-repeat alt+down resize_window shorter 5
map --mode tmux-repeat alt+up resize_window taller 5
map --mode tmux-repeat alt+right resize_window wider 5
map --mode tmux-repeat ctrl+left resize_window narrower 1
map --mode tmux-repeat ctrl+down resize_window shorter 1
map --mode tmux-repeat ctrl+up resize_window taller 1
map --mode tmux-repeat ctrl+right resize_window wider 1

map --new-mode tmux --on-action=end --on-unknown=end ctrl+b

# Send Ctrl-b through to a program (also makes nested tmux usable with C-b C-b).
map --mode tmux ctrl+b send_key ctrl+b

# Tmux windows -> Kitty tabs
map --mode tmux c new_tab_with_cwd
map --mode tmux n next_tab
map --mode tmux ctrl+n next_tab
map --mode tmux p previous_tab
map --mode tmux ctrl+p previous_tab
map --mode tmux b goto_tab -1
map --mode tmux 1 goto_tab 1
map --mode tmux 2 goto_tab 2
map --mode tmux 3 goto_tab 3
map --mode tmux 4 goto_tab 4
map --mode tmux 5 goto_tab 5
map --mode tmux 6 goto_tab 6
map --mode tmux 7 goto_tab 7
map --mode tmux 8 goto_tab 8
map --mode tmux 9 goto_tab 9
map --mode tmux 0 goto_tab 10
map --mode tmux , set_tab_title
map --mode tmux 0x26 close_tab
map --mode tmux 0x3c combine : move_tab_backward : push_keyboard_mode tmux-repeat
map --mode tmux 0x3e combine : move_tab_forward : push_keyboard_mode tmux-repeat
map --mode tmux 0x27 select_tab
map --mode tmux w select_tab
map --mode tmux f select_tab

# Shifted punctuation as produced by the configured German XKB layout.
# Keeping these explicit makes Kitty behave like tmux, which binds the resulting
# character rather than the key's US-layout position.
map --mode tmux shift+6 close_tab
map --mode tmux shift+0x3c combine : move_tab_forward : push_keyboard_mode tmux-repeat
map --mode tmux shift+0x23 select_tab

# Tmux panes -> Kitty windows. pain-control's %, |, " and - bindings all keep
# the current directory. Kitty cannot reproduce tmux's full-span -f variants,
# so backslash and underscore use the matching ordinary split direction.
map --mode tmux 0x25 combine : goto_layout splits : new_window_with_cwd !vsplit
map --mode tmux 0x7c combine : goto_layout splits : new_window_with_cwd !vsplit
map --mode tmux 0x5c combine : goto_layout splits : new_window_with_cwd !vsplit
map --mode tmux 0x22 combine : goto_layout splits : new_window_with_cwd !hsplit
map --mode tmux - combine : goto_layout splits : new_window_with_cwd !hsplit
map --mode tmux 0x5f combine : goto_layout splits : new_window_with_cwd !hsplit
map --mode tmux shift+5 combine : goto_layout splits : new_window_with_cwd !vsplit
map --mode tmux ctrl+alt+0x3c combine : goto_layout splits : new_window_with_cwd !vsplit
map --mode tmux ctrl+alt+0xdf combine : goto_layout splits : new_window_with_cwd !vsplit
map --mode tmux shift+2 combine : goto_layout splits : new_window_with_cwd !hsplit
map --mode tmux shift+- combine : goto_layout splits : new_window_with_cwd !hsplit
map --mode tmux x close_window_with_confirmation
map --mode tmux z toggle_layout stack
map --mode tmux o next_window
map --mode tmux 0x3b nth_window -1
map --mode tmux shift+, nth_window -1
map --mode tmux q kitty_tmux select-pane
map --mode tmux 0x21 detach_window new-tab
map --mode tmux shift+1 detach_window new-tab
map --mode tmux 0x7b move_window_backward
map --mode tmux 0x7d move_window_forward
map --mode tmux ctrl+alt+7 move_window_backward
map --mode tmux ctrl+alt+0 move_window_forward
map --mode tmux ctrl+o move_window_forward
map --mode tmux alt+o move_window_backward

# Pane navigation: tmux defaults plus tmux-pain-control's Vim keys.
map --mode tmux h neighboring_window left
map --mode tmux ctrl+h neighboring_window left
map --mode tmux left neighboring_window left
map --mode tmux j neighboring_window bottom
map --mode tmux ctrl+j neighboring_window bottom
map --mode tmux down neighboring_window bottom
map --mode tmux k neighboring_window top
map --mode tmux ctrl+k neighboring_window top
map --mode tmux up neighboring_window top
map --mode tmux l neighboring_window right
map --mode tmux ctrl+l neighboring_window right
map --mode tmux right neighboring_window right

# Pane resizing: five cells for pain-control's H/J/K/L and Alt-arrows, one cell
# for tmux's Ctrl-arrow bindings.
map --mode tmux shift+h combine : resize_window narrower 5 : push_keyboard_mode tmux-repeat
map --mode tmux shift+j combine : resize_window shorter 5 : push_keyboard_mode tmux-repeat
map --mode tmux shift+k combine : resize_window taller 5 : push_keyboard_mode tmux-repeat
map --mode tmux shift+l combine : resize_window wider 5 : push_keyboard_mode tmux-repeat
map --mode tmux alt+left combine : resize_window narrower 5 : push_keyboard_mode tmux-repeat
map --mode tmux alt+down combine : resize_window shorter 5 : push_keyboard_mode tmux-repeat
map --mode tmux alt+up combine : resize_window taller 5 : push_keyboard_mode tmux-repeat
map --mode tmux alt+right combine : resize_window wider 5 : push_keyboard_mode tmux-repeat
map --mode tmux ctrl+left combine : resize_window narrower 1 : push_keyboard_mode tmux-repeat
map --mode tmux ctrl+down combine : resize_window shorter 1 : push_keyboard_mode tmux-repeat
map --mode tmux ctrl+up combine : resize_window taller 1 : push_keyboard_mode tmux-repeat
map --mode tmux ctrl+right combine : resize_window wider 1 : push_keyboard_mode tmux-repeat

# Layout, scrollback, paste, command selection and config reload equivalents.
map --mode tmux space kitty_tmux next-layout
map --mode tmux alt+1 goto_layout horizontal
map --mode tmux alt+2 goto_layout vertical
map --mode tmux alt+3 goto_layout fat
map --mode tmux alt+4 goto_layout fat:mirrored=true
map --mode tmux alt+5 goto_layout tall
map --mode tmux alt+6 goto_layout tall:mirrored=true
map --mode tmux alt+7 goto_layout grid
map --mode tmux 0x5b kitty_scrollback_nvim
map --mode tmux ctrl+alt+8 kitty_scrollback_nvim
map --mode tmux page_up kitty_scrollback_nvim
map --mode tmux 0x5d paste_from_clipboard
map --mode tmux ctrl+alt+9 paste_from_clipboard
map --mode tmux 0x3a command_palette
map --mode tmux shift+. command_palette
map --mode tmux 0x3f kitty_tmux_help
map --mode tmux shift+0xdf kitty_tmux_help
map --mode tmux shift+r load_config_file


# Scriptable control, restricted to Kitty's dedicated socket
allow_remote_control socket-only
listen_on unix:@kitty

# Permit writes, but keep clipboard reads behind Kitty's confirmation prompt.
clipboard_control write-clipboard write-primary ask

# Auto-copy mouse selections to the clipboard (tmux-yank parity)
copy_on_select yes

# Useful layouts and a compact, informative tab bar
enabled_layouts splits,horizontal,vertical,fat,fat:mirrored=true,tall,tall:mirrored=true,grid,stack
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_font_style bold
inactive_tab_font_style normal

enable_audio_bell no

window_padding_width 4
# selection_foreground none
# selection_background none


# BEGIN_KITTY_THEME
# Carbonfox
include current-theme.conf
# END_KITTY_THEME
