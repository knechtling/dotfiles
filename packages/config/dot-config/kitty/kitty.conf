font_family Fira Code SemiBold
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 1
confirm_os_window_close 0

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 10000
scrollback_pager_history_size 20
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_min_lines 1

# Shell integration and command-output navigation
shell_integration enabled
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1
mouse_map right press ungrabbed mouse_select_command_output

# Browse/search full scrollback in Neovim (kitty-scrollback.nvim)
action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
map ctrl+shift+s kitty_scrollback_nvim
# Last command's output in Neovim. show_last_command_output would send it to
# scrollback_pager, which cannot be nvim: a normal buffer shows ANSI escapes
# literally. These are the plugin's own recommended mappings.
map ctrl+shift+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# Open new shells in the current working directory
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t new_tab_with_cwd

# Move between panes like tmux did. These override kitty's defaults for h/j/k/l
# (show_scrollback and line scrolling); scrolling stays on ctrl+shift+up/down
# and ctrl+shift+page_up/page_down, and the scrollback is on ctrl+shift+s.
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# next_layout moves off ctrl+shift+l, which is now "focus right".
map ctrl+shift+backslash next_layout

# Resize panes with the mouse. kitty 0.46 and newer resize by dragging a border
# directly (see window_drag_tolerance), which replaces the old side-button
# mappings. ctrl+right-click still opens kitty's resize mode (ctrl+w/n/t/s to
# resize, esc to finish) for keyboard-precise steps.
mouse_map ctrl+right press ungrabbed start_resizing_window

# Hints: pick visible URLs, paths, lines, or words without using the mouse
map ctrl+shift+e open_url_with_hints
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>l kitten hints --type line --program -
map ctrl+shift+p>w kitten hints --type word --program -
map ctrl+shift+p>y kitten hints --type hyperlink
map ctrl+shift+u kitten unicode_input


# Scriptable control, restricted to Kitty's dedicated socket
allow_remote_control socket-only
listen_on unix:@kitty

# Permit writes, but keep clipboard reads behind Kitty's confirmation prompt.
clipboard_control write-clipboard write-primary ask

# Useful layouts and a compact, informative tab bar
enabled_layouts splits,stack,tall,grid
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_font_style bold
inactive_tab_font_style normal

enable_audio_bell no

window_padding_width 4
# selection_foreground none
# selection_background none


# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME
