# Preview local images inside Kitty.
protocol file
mime image/*
action launch --type=overlay kitten icat --hold -- ${FILE_PATH}

# Follow logs in a dedicated tab.
protocol file
ext log
action launch --type=tab --title ${FILE} tail -f -- ${FILE_PATH}

# Open source-file hyperlinks in Neovim.
protocol file
mime text/*
action launch --type=tab --cwd=current ${EDITOR} ${FILE_PATH}

# Keep normal web links in the desktop browser.
protocol http https
action launch --type=background xdg-open ${URL}

# Let Kitty handle remote file links (view, download, or edit and sync back).
protocol file
file *
action remote_file
