# Defaults for `kitten ssh HOST`.
hostname *
shell_integration inherited
remote_kitty if-needed
share_connections yes
askpass unless-set

# Never expose the local Kitty control socket to remote hosts by default.
forward_remote_control no

# Preserve the common interactive environment without copying private config.
env LANG=_kitty_copy_env_var_
env LC_ALL=_kitty_copy_env_var_
env COLORTERM=truecolor
