set -sg history-file ~/.tmux_history
set -g history-limit 99999


#resurrect tests
set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager.
# Keep this line at the very bottom of tmux.conf
if-shell 'test -x /usr/share/tmux-plugin-manager/tpm' 'run-shell /usr/share/tmux-plugin-manager/tpm' 'if-shell "test -x ~/.tmux/plugins/tpm/tpm" "run-shell ~/.tmux/plugins/tpm/tpm" "display-message TPM-not-installed"'

# Mouse selection keybindings (must come after TPM to override tmux-yank)
# Keep selection after mouse drag ends
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Double-click to select word (works from normal mode)
bind-key -T root DoubleClick1Pane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "select-pane -t = \; copy-mode -H \; send-keys -X select-word \; send-keys -X copy-selection-no-clear"
bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-selection-no-clear

# Triple-click to select line (works from normal mode)
bind-key -T root TripleClick1Pane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "select-pane -t = \; copy-mode -H \; send-keys -X select-line \; send-keys -X copy-selection-no-clear"
bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-selection-no-clear

# Explicit overrides after plugins. Prefix remains Ctrl-b.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-kitty:RGB:clipboard,foot*:RGB:clipboard'
set -s set-clipboard on
set -g allow-passthrough on
set -s escape-time 20
set -g focus-events on
set -g update-environment 'DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY XDG_RUNTIME_DIR'
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux config reloaded'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
